name: Release

# Publishes a GitHub release when a version tag is pushed, e.g.:
#   git tag v1.0.1 && git push origin v1.0.1
#
# The tag must match versionName in app/build.gradle.kts, and CHANGELOG.md should have a "## [1.0.1]"
# section, which becomes the release notes (also shown in the app's update dialog).
# The in-app updater installs the APK attached here.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   the release keystore (.jks), base64-encoded
#   RELEASE_KEYSTORE_PASSWORD its store password
#   RELEASE_KEY_ALIAS         the key alias
#   RELEASE_KEY_PASSWORD      the key password
# Every release must be signed with the same key, or Android won't install it over the previous one.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the signing secrets are set
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. See the comment at the top of release.yml."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache runtime components
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/bundled_components
          key: components-${{ hashFiles('tools/components.sha256') }}

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Unit tests
        run: ./gradlew testModernDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE" | base64 --decode > "$RELEASE_KEYSTORE_FILE"
          ./gradlew assembleModernRelease
          rm -f "$RELEASE_KEYSTORE_FILE"

      - name: Prepare the APK and release notes
        run: |
          apk=$(ls app/build/outputs/apk/modern/release/*.apk | head -n 1)
          mkdir -p dist
          cp "$apk" "dist/WoW-DS-v$VERSION.apk"
          (cd dist && sha256sum "WoW-DS-v$VERSION.apk" > "WoW-DS-v$VERSION.apk.sha256")
          # The CHANGELOG section for this version, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." > dist/notes.md
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/WoW-DS-v$VERSION.apk" \
            "dist/WoW-DS-v$VERSION.apk.sha256" \
            --title "WoW-DS $GITHUB_REF_NAME" \
            --notes-file dist/notes.md
